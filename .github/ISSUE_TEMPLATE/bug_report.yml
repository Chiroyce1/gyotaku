name: Bug report
description: Report a crash, incorrect behavior, or a screenshot that is not recognized correctly
labels: ['bug', 'triage']
body:
  - type: markdown
    attributes:
      value: |
        Before filing, check the [troubleshooting guide](https://github.com/xevrion/gyotaku/blob/main/docs/troubleshooting.md)
        for known problems and their solutions.

        Do not attach screenshots that contain private information. If a screenshot
        is not found by search, a similar image without private content is equally useful.

  - type: textarea
    id: what
    attributes:
      label: Description
      description: What you did, what you expected to happen, and what happened instead.
    validations:
      required: true

  - type: input
    id: distro
    attributes:
      label: Distribution and version
      placeholder: Ubuntu 24.04
    validations:
      required: true

  - type: input
    id: desktop
    attributes:
      label: Desktop environment and session type
      description: '`echo $XDG_CURRENT_DESKTOP $XDG_SESSION_TYPE` prints both.'
      placeholder: GNOME wayland
    validations:
      required: true

  - type: input
    id: gpu
    attributes:
      label: GPU
      description: Dedicated, integrated, or none, with the model if known.
      placeholder: Intel UHD 620 (integrated)

  - type: input
    id: version
    attributes:
      label: Commit
      description: Output of `git rev-parse --short HEAD` in your gyotaku checkout.
      placeholder: 0fec41e

  - type: textarea
    id: output
    attributes:
      label: Logs
      description: |
        - Window problems: output of `RUST_LOG=warn gyotaku-app --once`
        - Indexing problems: output of `journalctl --user -u gyotaku-watch -e`
        - Recognition problems: output of `gyotaku ocr path/to/screenshot.png`
      render: text

  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Screenshots or recordings of the window are helpful for visual problems.
