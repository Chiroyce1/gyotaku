name: Compatibility report
description: Report how gyotaku runs on a distribution, desktop or hardware configuration
labels: ['compatibility']
body:
  - type: markdown
    attributes:
      value: |
        Several configurations are listed as "Not yet verified" in the
        [compatibility matrix](https://github.com/xevrion/gyotaku/blob/main/docs/compatibility.md),
        including GNOME, KDE Plasma, integrated GPUs, ARM and non-systemd distributions.
        Successful reports are as valuable as failures.

  - type: dropdown
    id: result
    attributes:
      label: Result
      options:
        - Works
        - Works with issues
        - Does not work
    validations:
      required: true

  - type: input
    id: distro
    attributes:
      label: Distribution and version
      placeholder: Linux Mint 22
    validations:
      required: true

  - type: input
    id: desktop
    attributes:
      label: Desktop environment and session type
      description: '`echo $XDG_CURRENT_DESKTOP $XDG_SESSION_TYPE` prints both.'
      placeholder: KDE wayland
    validations:
      required: true

  - type: input
    id: hardware
    attributes:
      label: CPU and GPU
      placeholder: Ryzen 5 5500U, integrated Radeon
    validations:
      required: true

  - type: checkboxes
    id: checked
    attributes:
      label: Verified functionality
      options:
        - label: Build completes following the README
        - label: Keyboard shortcut opens and closes the window
        - label: First run detects the screenshot folder
        - label: Background indexing picks up a new screenshot
        - label: Copying text and images works

  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: |
        Any problems or slowness observed. If available, include the output of
        `GYOTAKU_FRAME_STATS=1 gyotaku-app --once`, printed when the window closes.
      render: text
