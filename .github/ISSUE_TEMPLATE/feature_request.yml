name: Feature request
description: Suggest something gyotaku should do
labels: ['enhancement']
body:
  - type: textarea
    id: problem
    attributes:
      label: What you're trying to do
      description: |
        What you wanted to find or do, and where gyotaku got in the way.
        A real example beats a general description.
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: How you imagine it working, if you have an idea.

  - type: textarea
    id: alternatives
    attributes:
      label: Anything you already tried
