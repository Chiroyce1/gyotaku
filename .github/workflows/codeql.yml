name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # A weekly run catches new queries landing in CodeQL itself, not just new code.
  schedule:
    - cron: '31 4 * * 1'

# No job gets a token wider than it asks for.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # Uploading results to the security tab needs write here, nothing else.
      security-events: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # rust for the code, actions for the workflows themselves, since a
        # workflow that runs untrusted input is its own way in.
        language: [rust, actions]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # build-mode none reads the source without compiling it, so this job
      # doesn't need the window libraries or the long gpui build.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: '/language:${{ matrix.language }}'
