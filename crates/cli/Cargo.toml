[package]
name = "gyotaku"
description = "Search every screenshot you have ever taken by the text inside it"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
gyotaku-core.workspace = true
gyotaku-ocr.workspace = true
anyhow.workspace = true
directories.workspace = true
clap = { version = "4.6", features = ["derive"] }
fast_image_resize = { version = "5", features = ["image"] }
image = { version = "0.25", default-features = false, features = ["jpeg"] }
notify = "8"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Power", "Win32_System_Threading"] }
