[package]
name = "gyotaku-ocr"
description = "PP-OCRv6 text detection and recognition on ONNX Runtime, tuned for screenshots"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
gyotaku-core.workspace = true
anyhow.workspace = true
fast_image_resize = { version = "5", features = ["image"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
# ONNX Runtime linked in statically, downloaded at build time over rustls, so
# building needs no OpenSSL headers and the binary no runtime library.
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "download-binaries", "tls-rustls", "api-27"] }
sha2 = "0.10"
ureq = "3"
